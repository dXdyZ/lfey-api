services:
  postgres:
    image: postgres:latest
    container_name: user_db
    environment:
      POSTGRES_DB: lfey
      POSTGRES_USER: lfey_user
      POSTGRES_PASSWORD: lfey_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lfey_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lfey_user -d lfey"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.10.7-management
    hostname: rabbitmq
    restart: no
    networks:
      - lfey_network
    environment:
      - RABBITMQ_DEFAULT_USER=root
      - RABBITMQ_DEFAULT_PASS=werpipl15
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbit disk_free_limit 2147483648
    ports:
      - "15672:15672"
      - "5672:5672"
  redis:
    image: redis:7.2-alpine
    container_name: redis_dev
    networks:
      - lfey_network
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
#    environment:
#      - REDIS_PASSWORD=devpassword  # можно убрать, если не нужен пароль
    restart: unless-stopped

volumes:
  postgres_data:
  rabbit:
  redis_data:

networks:
  lfey_network:
